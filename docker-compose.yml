services:
  ms-sensor-management:
    build: .
    container_name: ms-sensor-management
    ports:
      - "3004:3004"
    environment:
      SERVER_PORT: 3004
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol_sensors}
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_pass}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15
    container_name: ms-sensor-management-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol_sensors}
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_pass}
    ports:
      - "5434:5432"
    volumes:
      - sensor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

volumes:
  sensor_postgres_data:

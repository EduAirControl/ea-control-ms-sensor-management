spring.datasource.url=jdbc:h2:mem:mssensor_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS sensors
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=sensors

spring.liquibase.enabled=false

jwt.secret=test-only-secret-for-unit-tests-0123456789abcdef
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

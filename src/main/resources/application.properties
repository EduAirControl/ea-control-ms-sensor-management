spring.application.name=ms-sensor-management

server.port=${SERVER_PORT:3004}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol_sensors}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=sensors

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Publicacion de eventos (ADR-007, outbox transaccional) ---
# SensorInstalled / SensorRemoved se escriben en sensors.outbox_event dentro de la
# misma transaccion que la instalacion, y el relay los publica a RabbitMQ.
# OUTBOX_ENABLED=false lo desactiva sin tocar codigo (tests, entornos sin broker).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.exchange=${SENSOR_EVENTS_EXCHANGE:eduaircontrol.sensor}
app.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
app.outbox.health-interval-ms=${OUTBOX_HEALTH_INTERVAL_MS:60000}
app.outbox.stale-minutes=${OUTBOX_STALE_MINUTES:5}

server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html

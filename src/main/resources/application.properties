spring.application.name=ms-sensor-management

server.port=${SERVER_PORT:3004}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol_sensors}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=sensors

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html
